<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp Log</title>
<meta name="description" content="Alex's recomp tracker: meals, training, lifts, weigh-ins and progress photos.">
<meta name="theme-color" content="#F1F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="gate" hidden></div>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="plate" aria-hidden="true"></span>Recomp Log</div>
    <div class="datenav" id="datenav">
      <button id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="label"><button id="todayBtn" title="Jump to today"><span id="dateLabel">Today</span></button></div>
      <button id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <span class="sync" id="syncDot" role="status" data-state="ok"></span>
    <button class="iconbtn" id="openSettings" aria-label="Targets and program"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 11h16M7 11V6a5 5 0 0 1 10 0v5M6 11l1 9h10l1-9"/></svg>Food</button>
    <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg>Train</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>Lifts</button>
    <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M5 20h14l-2-12H7zM9 8a3 3 0 0 1 6 0"/><path d="M12 13l2-2"/></svg>Body</button>
    <button data-tab="photos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Photos</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<datalist id="exnames"></datalist>


<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.error('service worker', err)));
}
</script>
</body>
</html>
